services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wabulk-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:wabulk_secure_pass@db:5432/wabulk?schema=public
      - REDIS_URL=redis://redis:6379
      - AUTH_SECRET=wabulk_super_secure_jwt_secret_key_production_2026
      - AUTH_COOKIE_NAME=wabulk_session
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN:-}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      - WHATSAPP_BUSINESS_ACCOUNT_ID=${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      - WHATSAPP_API_VERSION=v20.0
      - WHATSAPP_WEBHOOK_VERIFY_TOKEN=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-wabulk_verify_token_123}
      - MESSAGES_PER_MINUTE=60
      - MAX_CONCURRENT_JOBS=5
      - RETRY_LIMIT=3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: wabulk-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: wabulk_secure_pass
      POSTGRES_DB: wabulk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wabulk"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wabulk-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
